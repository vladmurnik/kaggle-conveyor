[project]
name = "kconv"
version = "0.1.0"
description = "Dataset-first Kaggle conveyor: drop data, choose a recipe and models, get a submission."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["kaggle", "machine-learning", "tabular-data", "automl", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "catboost>=1.2",
  "joblib>=1.4",
  "scipy>=1.13",
  "kaggle>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
# TabPFN is a large optional stack.  The base install never imports torch.
# For CUDA, install a matching torch wheel afterwards (see docs/tabpfn.md).
tabpfn = [
  "tabpfn>=9.2,<10",
]

[project.urls]
Homepage = "https://github.com/vladmurnik/kaggle-conveyor"
Repository = "https://github.com/vladmurnik/kaggle-conveyor"
Issues = "https://github.com/vladmurnik/kaggle-conveyor/issues"
Documentation = "https://github.com/vladmurnik/kaggle-conveyor/tree/main/docs"

[project.scripts]
kconv = "kconv.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kconv"]

[tool.hatch.build.targets.sdist]
include = ["src/kconv", "README.md", "README_RU.md", "LICENSE", "NOTICE.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "realdata: opt-in tests that use a sample of the local real dataset",
  "slow: tests that take minutes rather than seconds",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer's documented API is a call in the default; the decorator consumes it.
ignore = ["E501", "B008"]

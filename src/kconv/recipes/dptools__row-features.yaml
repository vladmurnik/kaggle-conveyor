id: dptools/row-features
kind: preset
title: dptools row-profile features
author: Nikita Kozodoi
source: https://github.com/kozodoi/dptools
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "Numeric tabular data where a row's mean/spread/profile adds signal beyond individual columns."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  features:
    target_encode: []
    frequency_encode: []
    auto_encode: true
    scale: auto
    impute: median
    drop_constant: true
    row_statistics: true
    row_statistics_stats: [mean, std, min, max, median]
  models: [lgbm, catboost]
  model_params: {}
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
attribution: "Row-wise aggregation and feature-engineering ideas from dptools (MIT); implemented label-free in kconv, no source code copied."

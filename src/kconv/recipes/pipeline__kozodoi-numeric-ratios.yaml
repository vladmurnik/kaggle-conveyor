id: pipeline/kozodoi-numeric-ratios
kind: pipeline
derived_from: kozodoi/tabular
title: Kozodoi numeric-ratio pipeline
author: Nikita Kozodoi
source: https://github.com/kozodoi/Kaggle_Home_Credit
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "Numeric-heavy tabular data where pairwise products, ratios and differences plus target/frequency encoding add signal."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  models: [lgbm, catboost]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
      params: {max_categories: 100}
    - type: numeric_interactions
      params: {columns: auto, max_pairs: 6, operations: [product, ratio, difference]}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Practical high-cardinality feature-engineering ideas from kozodoi/Kaggle_Home_Credit (MIT); numeric products/ratios/differences and fold-fitted encodings are original label-free kconv implementations, no source code copied."

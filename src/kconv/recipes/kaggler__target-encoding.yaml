id: kaggler/target-encoding
kind: preset
title: Kaggler target-encoding baseline
author: Jeong-Yoon Lee
source: https://github.com/jeongyoonlee/Kaggler
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "High-cardinality categorical tabular data with fold-safe target/frequency encoding and a lean GBDT blend."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  features:
    target_encode: []
    frequency_encode: []
    auto_encode: true
    scale: auto
    impute: median
    drop_constant: true
  models: [lgbm, xgb]
  model_params: {}
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
attribution: "Target/frequency-encoding and blending ideas from Kaggler (MIT); encoding is reimplemented fit-in-fold in kconv, no source code copied."

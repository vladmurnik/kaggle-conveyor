id: minerva/stacking
kind: preset
title: Minerva open-solution stacking
author: Minerva ML
source: https://github.com/minerva-ml/open-solution-home-credit
license: MIT
group: ensemble
tasks: [binary, multiclass, regression]
best_for: "Diverse model families and OOF stacking/blending experiments."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  features:
    target_encode: []
    frequency_encode: []
    scale: auto
    impute: median
    drop_constant: true
  models: [lgbm, xgb, catboost, logreg]
  model_params: {}
  hpo:
    enabled: false
    trials: 30
    timeout_sec: 900
  ensemble:
    method: stack
    fallback: best_single
    meta_model: auto
    meta_splits: 5
attribution: "Open-solution modular/stacking ideas; no code copied."

id: pipeline/kaggle-ieee-missing-group
kind: pipeline
derived_from: kaggle-ieee/fraud-pipeline
title: IEEE fraud missing-group pipeline
author: Rob Mulla
source: https://github.com/RobMulla/kaggle-ieee-fraud-detection
license: Apache-2.0
group: engineering
tasks: [binary, multiclass, regression]
best_for: "Wide tables with informative missingness and meaningful categorical group structure."
defaults:
  validation:
    strategy: auto
    n_splits: 5
  models: [lgbm, xgb]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
      params: {max_categories: 100}
    - type: missingness
      params: {columns: auto, indicators: true, row_count: true, zero_count: true}
    - type: group_statistics
      params: {group_col: auto, columns: auto, stats: [mean, std, count], max_columns: 8}
    - type: target_encoding
      params: {columns: auto, smoothing: 20}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Wide-table missingness and group-aggregate workflow ideas from Rob Mulla's kaggle-ieee-fraud-detection (Apache-2.0); missingness indicators, fit-in-fold group statistics and encodings are original kconv implementations, no source code copied."

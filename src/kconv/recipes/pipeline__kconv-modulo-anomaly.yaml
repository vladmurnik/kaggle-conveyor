id: pipeline/kconv-modulo-anomaly
kind: pipeline
derived_from: kconv/sklearn-diverse
title: kconv modulo-anomaly pipeline
author: kconv
source: local
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "A broad label-free profile combining modulo/divisibility features, anomaly scores and numeric ratios."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  models: [lgbm, histgb, random_forest_classifier, random_forest_regressor]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
      params: {scale: standard}
    - type: modulo
      params: {moduli: [10, 100], steps: [5]}
    - type: anomaly
      params: {columns: auto, n_estimators: 80, contamination: auto, include_flag: true}
    - type: numeric_interactions
      params: {columns: auto, max_pairs: 4, operations: [ratio, difference]}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: variance, max_features: 50}
attribution: "Original kconv catalog recipe; combines modulo/divisibility features with fit-in-fold anomaly scores and numeric ratios, no external source code copied."

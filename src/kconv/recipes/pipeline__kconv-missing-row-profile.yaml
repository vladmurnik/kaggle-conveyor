id: pipeline/kconv-missing-row-profile
kind: pipeline
derived_from: dptools/row-features
title: kconv missing-row profile pipeline
author: Nikita Kozodoi
source: https://github.com/kozodoi/dptools
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "Wide tables where missingness patterns and row-level distribution shape carry signal."
defaults:
  validation:
    strategy: auto
    n_splits: 5
  models: [lgbm, catboost]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
    - type: missingness
      params: {columns: auto, indicators: true, row_count: true, zero_count: true}
    - type: row_statistics
      params: {stats: [mean, std, min, max, median]}
    - type: numeric_interactions
      params: {columns: auto, max_pairs: 6, operations: [product, ratio, difference]}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Row-profile idea adapted from kozodoi/dptools (MIT); missingness indicators, row statistics and numeric interactions are original kconv implementations."

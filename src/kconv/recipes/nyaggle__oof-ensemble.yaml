id: nyaggle/oof-ensemble
kind: preset
title: nyaggle OOF ensemble
author: Kota Yuhara (nyanp)
source: https://github.com/nyanp/nyaggle
license: MIT
group: ensemble
tasks: [binary, multiclass, regression]
best_for: "OOF experiment tracking and a compact GBDT stack for medium tabular datasets."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  features:
    target_encode: []
    frequency_encode: []
    auto_encode: true
    scale: auto
    impute: median
    drop_constant: true
  models: [lgbm, xgb, catboost]
  model_params: {}
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: stack
    fallback: best_single
    meta_model: auto
    meta_splits: 5
attribution: "OOF experiment-tracking and stacking ideas from nyaggle (MIT); original config and adapters, no source code copied."

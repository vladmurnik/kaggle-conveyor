id: pipeline/knnfeat-cluster-anomaly
kind: pipeline
derived_from: knnfeat/knn-features
title: knnFeat cluster-anomaly pipeline
author: Shotaro Ishihara (upura)
source: https://github.com/upura/knnFeat
license: MIT
group: engineering
tasks: [binary, multiclass]
best_for: "Classification tables where class-conditional kNN distances complement cluster and anomaly features."
defaults:
  validation:
    strategy: auto
    n_splits: 5
  models: [lgbm, xgb]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
    - type: clustering
      params:
        {
          columns: auto,
          n_clusters: 8,
          max_iter: 100,
          include_distances: true,
          include_labels: false,
          max_fit_rows: 50000,
        }
    - type: anomaly
      params: {columns: auto, n_estimators: 100, contamination: auto, include_flag: true}
    - type: knn_class_distance
      params: {neighbors: 3, folds: 5, max_reference_rows: 50000}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Class-distance method adapted from upura/knnFeat (MIT); cluster and anomaly features plus fit-in-fold kNN OOF distances are original kconv implementations, no source code copied."

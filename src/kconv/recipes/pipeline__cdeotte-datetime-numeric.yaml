id: pipeline/cdeotte-datetime-numeric
kind: pipeline
derived_from: cdeotte/tabular
title: cdeotte datetime-numeric pipeline
author: Chris Deotte
source: https://github.com/cdeotte/KGMON-Playbook-2026
license: "NO LICENSE - ideas only"
group: engineering
tasks: [binary, multiclass, regression]
best_for: "Datetime-rich tabular data where cyclical calendar signals and numeric ratios interact."
defaults:
  validation:
    strategy: auto
    n_splits: 5
  models: [lgbm, xgb, catboost]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
    - type: datetime_cyclical
      params: {columns: auto, periods: [month, dayofweek, dayofyear]}
    - type: numeric_interactions
      params: {columns: auto, max_pairs: 6, operations: [product, ratio, difference, sum]}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Cyclical datetime and numeric interaction ideas adapted from Chris Deotte's KGMON playbook (no license, ideas only); all feature code is original kconv."

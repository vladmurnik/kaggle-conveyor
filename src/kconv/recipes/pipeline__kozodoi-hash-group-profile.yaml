id: pipeline/kozodoi-hash-group-profile
kind: pipeline
derived_from: kozodoi/tabular
title: Kozodoi hash-group profile pipeline
author: Nikita Kozodoi
source: https://github.com/kozodoi/Kaggle_Home_Credit
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "High-cardinality categorical tables that need compact hashing plus fit-in-fold group aggregates."
defaults:
  validation:
    strategy: auto
    n_splits: 5
  models: [lgbm, catboost]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
      params: {max_categories: 100}
    - type: hash_encoding
      params: {columns: auto, n_features: 32}
    - type: group_statistics
      params: {group_col: auto, columns: auto, stats: [mean, std, count], max_columns: 8}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "High-cardinality workflow ideas from kozodoi/Kaggle_Home_Credit (MIT); hashing, fit-in-fold group aggregates and encoding features are original kconv implementations, no source code copied."

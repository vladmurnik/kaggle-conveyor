id: ensemble-amazon/stacking
kind: preset
title: ensemble_amazon meta-stack
author: kaz-Anova
source: https://github.com/kaz-Anova/ensemble_amazon
license: Apache-2.0
group: ensemble
tasks: [binary, multiclass, regression]
best_for: "Diverse GBDT/linear members with OOF meta-stacking on AUC-style tabular problems."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  features:
    target_encode: []
    frequency_encode: []
    auto_encode: true
    scale: auto
    impute: median
    drop_constant: true
  models: [lgbm, xgb, catboost, logreg]
  model_params: {}
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: stack
    fallback: best_single
    meta_model: auto
    meta_splits: 5
attribution: "Weighted/rank averaging and meta-stacking ideas from ensemble_amazon (Apache-2.0); original kconv adapters, no source code copied."

id: pipeline/kozodoi-combination-frequency
kind: pipeline
derived_from: kozodoi/tabular
title: Kozodoi combination-frequency pipeline
author: Nikita Kozodoi
source: https://github.com/kozodoi/Kaggle_Home_Credit
license: MIT
group: engineering
tasks: [binary, multiclass, regression]
best_for: "High-cardinality categorical data with pairwise interaction frequencies, stable hash buckets and model-importance selection."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  models: [lgbm, catboost]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
      params: {max_categories: 100}
    - type: hash_encoding
      params: {columns: auto, n_features: 32}
    - type: categorical_interaction
      params: {columns: auto, max_pairs: 4, encoding: frequency}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Categorical-combination and frequency-encoding ideas inspired by kozodoi/Kaggle_Home_Credit (MIT); pairwise interactions, hash buckets and fold-fitted frequency maps are original kconv implementations."

id: statsmaster/tabular
kind: preset
title: StatsMaster honest-CV tabular
author: StatsMaster
source: https://github.com/StatsMaster/kaggle-grandmaster-templates
license: "NO LICENSE - ideas only"
group: ensemble
tasks: [binary, multiclass, regression]
best_for: "Competition-grade tabular baselines with honest CV, seed diversity and lean blends."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  features:
    target_encode: []
    frequency_encode: []
    scale: auto
    impute: median
    drop_constant: true
  models: [lgbm, xgb, catboost]
  model_params: {}
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
attribution: "Methodology ideas from public grandmaster templates; no source code copied."

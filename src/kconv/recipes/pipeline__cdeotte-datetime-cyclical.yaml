id: pipeline/cdeotte-datetime-cyclical
kind: pipeline
derived_from: cdeotte/tabular
title: Cdeotte datetime-cyclical pipeline
author: Chris Deotte
source: https://github.com/cdeotte/KGMON-Playbook-2026
license: NO LICENSE - ideas only
group: ensemble
tasks: [binary, multiclass, regression]
best_for: "Datetime-aware tabular data with sin/cos calendar features, target/frequency encoding and a diverse GBDT blend."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  models: [lgbm, xgb, catboost]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
    - type: datetime_cyclical
      params: {columns: auto, periods: [month, dayofweek, dayofyear, hour]}
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Calendar/cyclical feature ideas inspired by Chris Deotte's KGMON playbook (ideas only); sin/cos encodings, fold-fitted target/frequency maps and the kconv blend are original implementations."

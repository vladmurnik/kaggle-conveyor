id: pipeline/kaggle-ieee-missing-cluster
kind: pipeline
derived_from: kaggle-ieee/fraud-pipeline
title: IEEE fraud missing-cluster pipeline
author: Rob Mulla
source: https://github.com/RobMulla/kaggle-ieee-fraud-detection
license: Apache-2.0
group: engineering
tasks: [binary, multiclass, regression]
best_for: "Wide datetime tables where missingness and cluster geometry both carry fraud or risk signal."
defaults:
  validation:
    strategy: auto
    n_splits: 5
  models: [lgbm, xgb]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
pipeline:
  blocks:
    - type: base
      params: {max_categories: 100}
    - type: missingness
      params: {columns: auto, indicators: true, row_count: true, zero_count: true}
    - type: datetime_cyclical
      params: {columns: auto, periods: [month, dayofweek, hour]}
    - type: clustering
      params:
        {
          columns: auto,
          n_clusters: 8,
          max_iter: 100,
          include_distances: true,
          include_labels: false,
          max_fit_rows: 50000,
        }
    - type: target_encoding
      params: {columns: auto, smoothing: 20}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 40}
attribution: "Wide-table missingness and datetime workflow ideas from Rob Mulla's kaggle-ieee-fraud-detection (Apache-2.0); missingness indicators, cyclical calendar features, fit-in-fold cluster distances and encodings are original kconv implementations, no source code copied."

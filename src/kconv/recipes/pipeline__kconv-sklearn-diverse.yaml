id: pipeline/kconv-sklearn-diverse
kind: pipeline
derived_from: kconv/sklearn-diverse
title: kconv diverse sklearn pipeline
author: kconv
source: local
license: MIT
group: ensemble
tasks: [binary, multiclass, regression]
best_for: "A broad, cheap baseline mixing GBDTs with scikit-learn forests and linear models."
defaults:
  validation:
    strategy: auto
    n_splits: 5
    shuffle: true
    random_state: 42
  models: [lgbm, histgb, random_forest_classifier, random_forest_regressor]
  hpo:
    enabled: false
    trials: 20
    timeout_sec: 600
  ensemble:
    method: weighted
    fallback: best_single
    meta_model: auto
    meta_splits: 5
pipeline:
  blocks:
    - type: base
    - type: target_encoding
      params: {columns: auto, smoothing: 10}
    - type: frequency_encoding
      params: {columns: auto}
    - type: feature_selection
      params: {method: model_importance, max_features: 30}
attribution: "Original kconv catalog recipe, now expressed as an executable block pipeline; no external source code copied."
